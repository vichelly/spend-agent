[project]
name = "finops-agent"
version = "0.1.0"
description = "An AI agent that analyzes AWS cost data and finds savings (Claude + tool use)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.100",
    "fastapi>=0.110",
    "pydantic>=2.6",
    "mangum>=0.17",
]

[project.optional-dependencies]
openai = ["openai>=1.40"]  # for Gemini / Z.ai / DeepSeek / Groq (OpenAI-compatible)
dev = ["pytest>=8", "ruff>=0.5", "uvicorn>=0.29", "boto3>=1.34"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "evals"]

[tool.setuptools.package-data]
finops_agent = ["index.html"]
